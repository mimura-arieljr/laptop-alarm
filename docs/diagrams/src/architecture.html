<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Alarm architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

    .n { font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
    .s { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
    .a { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #5a6580; text-anchor: middle; letter-spacing: 0.06em; }
    .e { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; fill: #5a6580; text-anchor: middle; letter-spacing: 0.14em; }
    .l { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Laptop Alarm</p>
    <h1>How Laptop Alarm is put together</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Laptop Alarm architecture</title>
        <desc id="architecture-desc">A menu bar app in your session starts a root alarm engine through the macOS administrator prompt and talks to it over a private socket, while the engine reads the sensors, plays the siren, blocks sleep and sends a push.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="32" y="172" width="208" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="44" y="176" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="88" y="185" class="e">YOUR SESSION</text>

        <rect x="480" y="172" width="208" height="384" rx="8" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="492" y="176" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="185" class="e">ROOT PROCESS</text>

        <!-- Arrows first -->
        <line x1="216" y1="232" x2="504" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="504" y1="264" x2="216" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="136" y1="284" x2="136" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="216" y1="404" x2="504" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="768" y1="216" x2="664" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="664" y1="316" x2="768" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="664" y1="416" x2="768" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="664" y1="516" x2="768" y2="516" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels -->
        <rect x="328" y="212" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="221" class="a">COMMANDS</text>
        <rect x="340" y="272" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="281" class="a">STATE</text>
        <rect x="146" y="318" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="170" y="327" class="a">LAUNCH</text>
        <rect x="314" y="382" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="391" class="a">STARTS AS ROOT</text>
        <rect x="694" y="194" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="203" class="a">READS</text>
        <rect x="696" y="294" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="303" class="a">SIREN</text>
        <rect x="688" y="394" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="403" class="a">NO SLEEP</text>
        <rect x="698" y="494" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="503" class="a">PUSH</text>

        <!-- Socket caption -->
        <text x="360" y="316" class="e">UNIX SOCKET</text>
        <text x="360" y="332" class="s">/var/run/laptop-alarm.sock</text>
        <text x="360" y="346" class="s">mode 0600, owned by you</text>

        <!-- Nodes -->
        <!-- Menu bar app -->
        <rect x="56" y="204" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="204" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="240" class="n">Menu bar app</text>
        <text x="136" y="258" class="s">LaptopAlarm.app</text>

        <!-- Admin prompt -->
        <rect x="56" y="364" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="364" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="136" y="400" class="n">Admin prompt</text>
        <text x="136" y="418" class="s">asks for your password</text>

        <!-- Alarm engine (focal) -->
        <rect x="504" y="204" width="160" height="320" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="204" width="160" height="320" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="584" y="244" class="n">Alarm engine</text>
        <text x="584" y="262" class="s">laptop-alarm</text>
        <line x1="528" y1="280" x2="640" y2="280" stroke="rgba(191,69,32,0.30)" stroke-width="0.8"/>
        <text x="584" y="312" class="s">wake + read sensors</text>
        <text x="584" y="344" class="s">watch for triggers</text>
        <text x="584" y="376" class="s">siren + spoken warning</text>
        <text x="584" y="408" class="s">block sleep while armed</text>
        <text x="584" y="440" class="s">send the push</text>
        <text x="584" y="472" class="s">check your password</text>
        <text x="584" y="504" class="s">restore on exit</text>

        <!-- Sensors -->
        <rect x="768" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="176" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="848" y="212" class="n">Sensors</text>
        <text x="848" y="230" class="s">accelerometer, lid angle</text>

        <!-- Speakers -->
        <rect x="768" y="276" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="276" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="848" y="312" class="n">Speakers</text>
        <text x="848" y="330" class="s">volume forced up</text>

        <!-- Sleep control -->
        <rect x="768" y="376" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="376" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="848" y="412" class="n">Sleep control</text>
        <text x="848" y="430" class="s">pmset disablesleep</text>

        <!-- ntfy.sh -->
        <rect x="768" y="476" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="476" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="848" y="512" class="n">ntfy.sh</text>
        <text x="848" y="530" class="s">push to your phone</text>

        <!-- Legend -->
        <line x1="30" y1="588" x2="930" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="608" class="l">LEGEND</text>
        <rect x="108" y="598" width="14" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="130" y="608" class="l">ENGINE</text>
        <rect x="210" y="598" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="608" class="l">COMPONENT</text>
        <rect x="340" y="598" width="14" height="12" rx="2" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="362" y="608" class="l">ROOT BOUNDARY</text>
        <line x1="500" y1="604" x2="528" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="536" y="608" class="l">CALL</text>
        <line x1="600" y1="604" x2="628" y2="604" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="636" y="608" class="l">PUSHED STATE</text>
        <line x1="760" y1="604" x2="788" y2="604" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="796" y="608" class="l">NETWORK</text>
      </svg>
    </div>
  </div>
</body>
</html>
