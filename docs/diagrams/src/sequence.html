<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Alarm sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

    .n { font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
    .s { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
    .a { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #5a6580; text-anchor: middle; letter-spacing: 0.06em; }
    .ak { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #bf4520; letter-spacing: 0.06em; }
    .l { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Laptop Alarm</p>
    <h1>From Arm to Disarm</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-title sequence-desc">
        <title id="sequence-title">Laptop Alarm: from arm to disarm</title>
        <desc id="sequence-desc">You arm from the menu bar app, the admin prompt starts the root engine, the engine pushes its state to the app, a motion trigger sends a phone push, and your password disarms it.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: You 100, App 288, Admin 480, Engine 672, ntfy 860 -->
        <line x1="100" y1="112" x2="100" y2="684" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="288" y1="112" x2="288" y2="684" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="112" x2="480" y2="684" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="672" y1="112" x2="672" y2="684" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="860" y1="112" x2="860" y2="684" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Engine activation bar -->
        <rect x="668" y="240" width="8" height="436" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- 1 You -> App: ARM -->
        <line x1="100" y1="160" x2="288" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="170" y="138" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="194" y="147" class="a">ARM</text>

        <!-- 2 App -> Admin: LAUNCH ENGINE -->
        <line x1="288" y1="208" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="328" y="186" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="195" class="a">LAUNCH ENGINE</text>

        <!-- 3 Admin -> Engine: START AS ROOT -->
        <line x1="480" y1="256" x2="668" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="518" y="234" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="243" class="a">START AS ROOT</text>

        <!-- 4 App -> Engine: CONNECT -->
        <line x1="288" y1="304" x2="668" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="334" y="282" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="291" class="a">CONNECT</text>

        <!-- 5 Engine -> App: STATE: ARMED (async push) -->
        <line x1="668" y1="352" x2="288" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="524" y="330" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="339" class="a">STATE: ARMED</text>

        <!-- 6 Engine self: motion trigger (headline) -->
        <path d="M676,400 H708 Q716,400 716,408 V424 Q716,432 708,432 H676" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="728" y="420" class="ak">TILT OVER 2 DEGREES</text>

        <!-- 7 Engine -> ntfy: PUSH -->
        <line x1="676" y1="480" x2="860" y2="480" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="750" y="458" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="770" y="467" class="a">PUSH</text>

        <!-- 8 Engine -> App: TRIGGERED (async push) -->
        <line x1="668" y1="528" x2="288" y2="528" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="528" y="506" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="515" class="a">TRIGGERED</text>

        <!-- 9 You -> App: DISARM -->
        <line x1="100" y1="576" x2="288" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="156" y="554" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="194" y="563" class="a">PASSWORD</text>

        <!-- 10 App -> Engine: DISARM -->
        <line x1="288" y1="624" x2="668" y2="624" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="326" y="602" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="360" y="611" class="a">DISARM B64</text>

        <!-- 11 Engine -> App: OK (return) -->
        <line x1="668" y1="672" x2="288" y2="672" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="552" y="650" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="574" y="659" class="a">OK</text>

        <!-- Actors -->
        <rect x="30" y="32" width="140" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="30" y="32" width="140" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="100" y="68" class="n">You</text>
        <text x="100" y="86" class="s">at the menu bar</text>

        <rect x="218" y="32" width="140" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="218" y="32" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="288" y="68" class="n">Menu bar app</text>
        <text x="288" y="86" class="s">your session</text>

        <rect x="410" y="32" width="140" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="410" y="32" width="140" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="480" y="68" class="n">Admin prompt</text>
        <text x="480" y="86" class="s">osascript</text>

        <rect x="602" y="32" width="140" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="602" y="32" width="140" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="672" y="68" class="n">Alarm engine</text>
        <text x="672" y="86" class="s">runs as root</text>

        <rect x="790" y="32" width="140" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="790" y="32" width="140" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="860" y="68" class="n">ntfy.sh</text>
        <text x="860" y="86" class="s">to your phone</text>

        <!-- Legend -->
        <line x1="30" y1="712" x2="930" y2="712" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="732" class="l">LEGEND</text>
        <line x1="108" y1="728" x2="136" y2="728" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="144" y="732" class="l">CALL</text>
        <line x1="212" y1="728" x2="240" y2="728" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="248" y="732" class="l">STATE PUSHED BY THE ENGINE</text>
        <line x1="470" y1="728" x2="498" y2="728" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="506" y="732" class="l">REPLY</text>
        <line x1="590" y1="728" x2="618" y2="728" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="626" y="732" class="l">NETWORK</text>
        <line x1="716" y1="728" x2="744" y2="728" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="752" y="732" class="l">THE TRIGGER</text>
      </svg>
    </div>
  </div>
</body>
</html>
