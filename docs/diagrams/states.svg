<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="states-title states-desc" id="states-root">
        <title id="states-title">Laptop Alarm engine states</title>
        <desc id="states-desc">The engine counts down, calibrates, then watches for triggers as armed or degraded, sounds the alarm when triggered, and ends as disarmed.</desc>
        <defs>
      <style>#states-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #states-root { font-family: var(--font-sans); color: var(--color-ink); }
      #states-root .diagram-container { width: 100%; overflow-x: auto; }
      #states-root .diagram-container { overflow-x: visible; }
      #states-root .n { font-family: Geist, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      #states-root .s { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
      #states-root .a { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #5a6580; text-anchor: middle; letter-spacing: 0.06em; }
      #states-root .c { font-family: 'Instrument Serif', 'Noto Serif', Georgia, serif; font-style: italic; font-size: 14px; fill: #5a6580; }
      #states-root .l { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.1em; }</style>
          <marker id="states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Transitions first -->
        <line x1="46" y1="200" x2="72" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <line x1="192" y1="200" x2="304" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <line x1="424" y1="200" x2="536" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <line x1="656" y1="200" x2="768" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <path d="M364,240 V352 Q364,360 372,360 H420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <path d="M596,240 V352 Q596,360 588,360 H540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <path d="M480,400 V432 Q480,440 488,440 H792 Q800,440 800,432 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>
        <line x1="856" y1="240" x2="856" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#states-arrow)"/>

        <!-- Transition labels -->
        <rect x="214" y="178" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="248" y="187" class="a">TIMER 10 S</text>
        <rect x="442" y="178" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="187" class="a">BASELINE OK</text>
        <rect x="674" y="178" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="712" y="187" class="a">ANY TRIGGER</text>
        <rect x="374" y="284" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="398" y="293" class="a">NO DATA</text>
        <rect x="606" y="284" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="642" y="293" class="a">STALE &gt; 2 S</text>
        <rect x="598" y="418" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="427" class="a">LID / CHARGER</text>
        <rect x="866" y="284" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="890" y="293" class="a">DISARM</text>

        <!-- Start dot -->
        <circle cx="40" cy="200" r="6" fill="#2d3142"/>

        <!-- States -->
        <rect x="72" y="160" width="120" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="72" y="160" width="120" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="132" y="196" class="n">Countdown</text>
        <text x="132" y="214" class="s">10 s by default</text>

        <rect x="304" y="160" width="120" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="304" y="160" width="120" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="364" y="196" class="n">Calibrating</text>
        <text x="364" y="214" class="s">1 s baseline</text>

        <rect x="536" y="160" width="120" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="536" y="160" width="120" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="596" y="196" class="n">Armed</text>
        <text x="596" y="214" class="s">watching</text>

        <rect x="420" y="320" width="120" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="420" y="320" width="120" height="80" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="480" y="356" class="n">Degraded</text>
        <text x="480" y="374" class="s">lid + charger only</text>

        <rect x="768" y="160" width="120" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="768" y="160" width="120" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="828" y="196" class="n">Triggered</text>
        <text x="828" y="214" class="s">siren, voice, push</text>

        <!-- End: ringed dot -->
        <circle cx="856" cy="352" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="856" cy="352" r="5" fill="#2d3142"/>
        <text x="856" y="384" class="n">Disarmed</text>

        <!-- Editorial callouts -->
        <text x="72" y="508" class="c">Cancel needs no password, but only works during the countdown or calibration.</text>
        <text x="72" y="536" class="c">Disarm needs your password. SIGTERM or SIGHUP from any state restores your settings first.</text>

        <!-- Legend -->
        <line x1="30" y1="572" x2="930" y2="572" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="592" class="l">LEGEND</text>
        <circle cx="116" cy="588" r="5" fill="#2d3142"/>
        <text x="128" y="592" class="l">START</text>
        <rect x="196" y="582" width="14" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="218" y="592" class="l">STATE</text>
        <rect x="290" y="582" width="14" height="12" rx="3" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,2" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="312" y="592" class="l">ARMED WITHOUT THE MOTION SENSOR</text>
        <rect x="562" y="582" width="14" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="584" y="592" class="l">ALARM SOUNDING</text>
        <circle cx="722" cy="588" r="6" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="722" cy="588" r="3.6" fill="#2d3142"/>
        <text x="736" y="592" class="l">END</text>
      </svg>
